{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | TourLink Admin{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --tourlink-forest: #063b00;
    --tourlink-green: #266210;
    --tourlink-ink: #18352a;
    --tourlink-muted: #647563;
    --tourlink-line: #d7e5d3;
    --tourlink-wash: #f0fdf4;
  }

  body {
    background: var(--tourlink-wash);
    color: var(--tourlink-ink);
  }

  #header {
    display: flex;
    align-items: center;
    min-height: 68px;
    padding: 0 32px;
    background: var(--tourlink-forest);
    box-shadow: 0 4px 18px rgba(23, 59, 42, .16);
  }

  #branding h1, #branding h1 a:link, #branding h1 a:visited {
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  #branding h1::before {
    content: "TL";
    display: inline-grid;
    width: 34px;
    height: 34px;
    margin-right: 11px;
    place-items: center;
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 10px;
    color: #d8f4df;
    font-size: 10px;
    letter-spacing: .08em;
    vertical-align: middle;
  }

  #user-tools {
    color: rgba(255,255,255,.76);
    font-size: 12px;
  }

  #user-tools a:link, #user-tools a:visited {
    color: #d8f4df;
    font-weight: 700;
  }

  #content {
    width: auto;
    max-width: 1240px;
    margin: 0 auto;
    padding: 34px 28px 56px;
  }

  #main { display: block; }
  #nav-sidebar { display: none; }
  #footer { min-height: 0; padding: 0 28px 28px; background: transparent; color: var(--tourlink-muted); }

  .breadcrumbs {
    padding: 14px 28px;
    border-bottom: 1px solid var(--tourlink-line);
    background: #fff;
    color: var(--tourlink-muted);
  }

  .breadcrumbs a { color: var(--tourlink-green); font-weight: 700; }
  .module, .dashboard .module { border: 1px solid var(--tourlink-line); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(24, 55, 39, .05); }
  .module h2, .module caption, .inline-group h2 { background: #f7fbf8; color: var(--tourlink-forest); }
  .module th, .module td { border-bottom-color: #edf3ef; }
  .object-tools a, .submit-row input.default { background: var(--tourlink-green); border-radius: 8px; }
  .object-tools a:hover, .submit-row input.default:hover { background: #174d2f; }
  a:link, a:visited { color: var(--tourlink-green); }
  a:hover { color: #174d2f; }

  @media (max-width: 700px) {
    #header { padding: 0 16px; }
    #content { padding: 22px 14px 40px; }
    #footer { padding: 0 14px 22px; }
    #user-tools { font-size: 10px; }
    .breadcrumbs { padding: 12px 16px; }
  }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">TourLink Admin</a></h1>
{% endblock %}

{% block nav-global %}{% endblock %}
